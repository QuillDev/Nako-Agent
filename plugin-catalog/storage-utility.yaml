known_issues:
  - "Linux (systemd) and macOS (launchd) are tested; Windows is not supported yet. On macOS, Pack now shows manual steps instead of pausing Nako, and files in project folders outside the Nako home are listed but not offered for cleanup (macOS cannot show every open folder)."
  - "Packing the session database pauses Nako services for a few minutes; it asks first and restarts what it stopped."
