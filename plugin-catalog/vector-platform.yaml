name: vector-platform
repo: https://github.com/BonesGit/nako-vector-platform
sha: 5b2e4b244076413139a4c8781047bf1dde138303
description: "Vector (vectorapp.io) messaging platform plugin: Nako becomes a first-class Nostr-based Vector bot (its own nsec/npub identity), relaying DMs through a local Rust sidecar that wraps vector-sdk. First run needs `nako gateway setup`, which provisions the bot identity (create or import). Disclosure — `nako gateway setup` downloads a prebuilt vector-bridge binary from github.com/BonesGit/nako-vector-platform/releases (tag v<version>, sha256 checked against that release's SHA256SUMS; set vector.prebuilt.download: false to build from the bundled Rust source), merges `vector:` settings into ~/.nako/config.yaml, writes VECTOR_* to ~/.nako/.env, and publishes a public bot profile (kind-0, bot: true) to Nostr discovery relays."
maintainer: BonesGit
tier: community
category: platform
docs_url: https://github.com/BonesGit/nako-vector-platform
