description: The Nako desktop app in your browser. `nako workbench` serves the desktop interface through the Nako dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `nako workbench` run and again after each Nako update it runs `npm install --ignore-scripts` (guided by Nako's lockfile) and Vite against your Nako checkout's desktop sources, writing only under ~/.nako/nako-workbench and its own plugin dir (the checkout is only read), and starts `nako dashboard` on loopback when none is running.
