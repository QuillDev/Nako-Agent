description: "GitHub Copilot model providers for Nako: `copilot` (the Copilot API with your Copilot subscription: GPT, Claude, Gemini and Grok models, sign in with `nako auth add copilot` or COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN) and `copilot-acp` (drives your installed GitHub Copilot CLI over ACP). Moved out of Nako core; profiles that used Copilot get it installed automatically. A Nako Labs plugin: built by Quill Dev, not supported. Disclosure — signs in with GitHub's device-code flow using the Copilot editor OAuth app, exchanges your GitHub token for a short-lived Copilot token at api.github.com and sends your prompts to api.githubcopilot.com (or models.github.ai); it calls GitHub only for profiles that chose Copilot, never runs `gh` or reads other tools' token files, and caches the exchanged token in <NAKO_HOME>/.copilot_jwt.json. copilot-acp runs your local `copilot` CLI."
